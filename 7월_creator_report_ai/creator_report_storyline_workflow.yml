        desc: creator_report_template_storyline.html 을 JSON + 6개 인사이트로 치환. 결정적 Python.
        code_language: python3
        code: |-
          import json
          import re


          TEMPLATE_HTML = "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>{{profile.username}} — 크리에이터 세일즈 리포트</title>\n<style>\n  /* =========================================================================\n     스토리라인 카드뉴스 v3 — 2단 구성.\n       1차: AI 강조 3가지 + 각 강조점을 지탱하는 근거 블록(AI가 지정)만.\n       2차: 강조점과 직접 엮이지 않은 나머지 데이터/시각화 모음.\n     근거 블록은 하단 '풀'에 정의돼 있고, assemble가 추출해 1차/2차로 재배치한다.\n     ========================================================================= */\n  :root{\n    --ink:#1a1a1a; --navy:#13233f; --cream:#f5f1e8; --paper:#efe7d6;\n    --coral:#ff6a5a; --butter:#ffce3a; --mint:#7fd1b9;\n    --card:#ffffff; --line:#e2d9c6; --muted:#8a806d;\n    --seq1:#c3d0e2; --seq2:#9fb3cf; --seq3:#7791b4; --seq4:#526f97; --seq5:#33507b; --seq6:#1e3a63; --seq7:#13233f;\n  }\n  *{box-sizing:border-box; margin:0; padding:0;}\n  html{scroll-behavior:smooth;}\n  body{background:#c9beab; color:var(--ink);\n    font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Apple SD Gothic Neo\",\"Malgun Gothic\",sans-serif;\n    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}\n  .page{max-width:860px; margin:24px auto; background:var(--cream);\n    box-shadow:0 18px 50px -20px rgba(0,0,0,.6); overflow:hidden;}\n  .h{font-weight:900; letter-spacing:-0.035em;}\n\n  .mk{background:linear-gradient(transparent 56%, rgba(255,206,58,.85) 56%); padding:0 3px; font-weight:900;}\n  .mk-c{background:linear-gradient(transparent 56%, rgba(255,106,90,.85) 56%); padding:0 3px; font-weight:900; color:var(--ink);}\n  .navy .mk-c, .coral .mk, .mint .mk{color:inherit;}\n\n  @keyframes rise{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;}}\n  @keyframes grow{from{transform:scaleX(0);} to{transform:scaleX(1);}}\n  @keyframes draw{to{stroke-dashoffset:0;}}\n  @media (prefers-reduced-motion:no-preference){\n    .panel{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;}\n    .bar-fill,.seg-fill{transform-origin:left center; animation:grow .95s cubic-bezier(.2,.8,.2,1) both;}\n    .spark polyline{stroke-dasharray:900; stroke-dashoffset:900; animation:draw 1.8s ease-out .3s forwards;}\n  }\n\n  /* ---- 패널 공통 ---- */\n  .panel{padding:44px 52px;}\n  .panel.navy{background:var(--navy); color:var(--cream);}\n  .panel.coral{background:var(--coral); color:#fff;}\n  .panel.mint{background:var(--mint); color:#0f3b30;}\n  .panel.cream{background:var(--cream); color:var(--ink);}\n  .kicker{font-size:12px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; opacity:.9;}\n  .navy .kicker{color:var(--butter);} .coral .kicker{color:#fff;} .mint .kicker{color:#0f3b30;} .cream .kicker{color:var(--coral);}\n  .ptitle{font-size:34px; line-height:1.2; margin-top:12px; max-width:640px;}\n  .pbody{font-size:15.5px; line-height:1.72; margin-top:16px; max-width:620px;}\n  .cream .pbody{color:#4a4436;} .navy .pbody{color:rgba(245,241,232,.82);}\n  .coral .pbody{color:rgba(255,255,255,.92);} .mint .pbody{color:#155345;}\n\n  .eg{margin-top:18px; padding:15px 18px; border-radius:14px; font-size:14px; line-height:1.66; font-weight:600; max-width:620px;}\n  .cream .eg{background:#ece2cf; color:#4a4436;} .navy .eg{background:rgba(255,255,255,.1);}\n  .coral .eg{background:rgba(255,255,255,.16);} .mint .eg{background:rgba(15,59,48,.1);}\n\n  .win{margin-top:18px; padding:15px 18px; border-radius:14px; font-size:14.5px; line-height:1.6; font-weight:800;\n    background:rgba(255,206,58,.2); color:var(--ink); max-width:620px; display:flex; gap:11px; align-items:flex-start;}\n  .navy .win,.coral .win,.mint .win{color:#fff; background:rgba(0,0,0,.22);}\n  .win svg{flex:none; margin-top:2px;}\n\n  /* ---- 커버 ---- */\n  .cover{position:relative; overflow:hidden;}\n  .cover::after{content:\"\"; position:absolute; right:-80px; top:-80px; width:260px; height:260px;\n    border-radius:50%; background:var(--coral); opacity:.16;}\n  .cover .ptitle{font-size:42px; position:relative; z-index:1;}\n  .cover-claim{font-size:15px; line-height:1.6; color:rgba(245,241,232,.9); margin-top:18px; max-width:600px; font-weight:600; position:relative; z-index:1;}\n  .who{display:flex; align-items:center; gap:15px; margin-top:26px; position:relative; z-index:1;}\n  .who .ava{width:60px; height:60px; border-radius:18px; background-size:cover; background-position:center;\n    border:2px solid rgba(255,255,255,.25); background-color:rgba(255,255,255,.12); flex:none;}\n  .who .n{font-weight:900; font-size:17px;}\n  .who .g{font-size:12.5px; color:rgba(245,241,232,.6); font-weight:700; margin-top:3px;}\n  .who .links{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}\n  .who .links a{font-size:11.5px; font-weight:800; color:#fff; text-decoration:none;\n    border:1.5px solid rgba(255,255,255,.3); padding:6px 11px; border-radius:20px; transition:.16s;}\n  .who .links a:hover{background:#fff; color:var(--navy);}\n  .desc{font-size:12.5px; line-height:1.6; color:rgba(245,241,232,.62); margin-top:16px; max-width:600px; white-space:pre-line;}\n  .strip{display:flex; margin-top:26px; border:1px solid rgba(255,255,255,.18); border-radius:16px; overflow:hidden; position:relative; z-index:1;}\n  .strip .cell{flex:1; padding:16px 18px; border-right:1px solid rgba(255,255,255,.13);}\n  .strip .cell:last-child{border-right:0;}\n  .strip .v{font-weight:900; font-size:24px; letter-spacing:-.03em; display:block; color:#fff;}\n  .strip .l{font-size:11px; color:rgba(245,241,232,.55); font-weight:800; margin-top:5px; display:block;}\n  .strip .spark{display:block; margin-top:7px; width:96px; height:24px;}\n\n  /* ---- AI PICK ---- */\n  .aibadge{display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:900; letter-spacing:.1em;\n    background:rgba(255,255,255,.22); padding:7px 14px; border-radius:30px;}\n  .mint .aibadge{background:rgba(15,59,48,.14);}\n\n  /* ---- 1차 근거 패널 (강조점 바로 아래, 컬러 카드에 붙임) ---- */\n  .ev-under{padding-top:34px;}\n  .ev-chapter{font-size:11.5px; font-weight:900; letter-spacing:.09em; text-transform:uppercase; color:var(--coral); margin-bottom:2px;}\n  .ev-block + .ev-block{border-top:1px dashed var(--line); margin-top:30px; padding-top:6px;}\n\n  /* ---- 소제목 ---- */\n  .sub{font-size:12px; font-weight:900; letter-spacing:.04em; text-transform:uppercase; margin:24px 0 12px;\n    display:flex; align-items:center; gap:8px; color:var(--muted);}\n  .sub .tick{width:16px; height:4px; border-radius:2px; background:var(--coral);}\n  .ev-block > .sub:first-child{margin-top:6px;}\n\n  /* ---- 랭킹 막대 ---- */\n  .rank{display:flex; flex-direction:column; gap:10px;}\n  .rank .r{display:flex; align-items:center; gap:11px; font-size:13.5px; font-weight:800;}\n  .rank .r .lab{width:96px; flex:none; color:#4a4436;}\n  .rank .r .track{flex:1; height:16px; background:#e6dcc8; border-radius:9px; overflow:hidden;}\n  .rank .r .bar-fill{display:block; height:100%; border-radius:9px; background:var(--navy);}\n  .rank .r .pc{width:34px; text-align:right; font-weight:900;}\n  .cols3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}\n  .cols3 .rank .r .lab{width:auto; flex:1;} .cols3 .rank .r{font-size:12px; gap:7px;} .cols3 .rank .r .pc{width:26px;}\n  .cardbox{background:var(--card); border:1.5px solid var(--line); border-radius:18px; padding:18px 20px;}\n  .cardbox .bt{font-size:12px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:12px;}\n\n  /* 키워드 */\n  .kwcloud{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}\n  .kw{background:#fff; border:1.5px solid var(--line); border-radius:20px; padding:7px 13px; font-size:13px; font-weight:800; color:#4a4436;}\n  .kw:nth-child(4n+1){background:var(--navy); color:#fff; border-color:var(--navy);}\n  .kw:nth-child(7n+3){background:var(--cream); color:var(--coral); border-color:#f0c9c1; font-size:15px;}\n\n  /* 오디언스 헤드라인 */\n  .audhero{margin-top:4px; background:var(--navy); color:var(--cream); border-radius:16px; padding:18px 22px;\n    font-size:17px; font-weight:800; letter-spacing:-.02em; line-height:1.4;}\n  .audhero b{color:var(--butter); font-weight:900;}\n\n  /* 스택 바 */\n  .stackbar{height:40px; border-radius:12px; overflow:hidden; display:flex; margin-top:6px; background:#e6dcc8;}\n  .stackbar .seg-fill{height:100%; display:flex; align-items:center; justify-content:center; color:#fff;\n    font-weight:900; font-size:12.5px; white-space:nowrap; overflow:hidden;}\n  .stacklabels{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; font-size:11.5px; font-weight:700; color:#4a4436;}\n  .stacklabels i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px;}\n  .splitbar{height:44px; border-radius:13px; overflow:hidden; display:flex;}\n  .splitbar .seg-fill{height:100%; display:flex; align-items:center; padding:0 16px; color:#fff; font-weight:900; font-size:15px;}\n\n  .chips{display:flex; flex-wrap:wrap; gap:8px;}\n  .chip{background:#fff; border:1.5px solid var(--line); border-radius:20px; padding:8px 15px; font-size:13px; font-weight:800;}\n  .chip.on{background:var(--navy); color:#fff; border-color:var(--navy);}\n\n  /* 등급칩 */\n  .mband{font-size:10.5px; font-weight:900; padding:4px 9px; border-radius:20px; white-space:nowrap; letter-spacing:-.01em;}\n  .mband.b5{background:var(--coral); color:#fff;}\n  .mband.b10{background:#ff9184; color:#fff;}\n  .mband.b25{background:var(--navy); color:#fff;}\n  .mband.bam{background:var(--mint); color:#0f3b30;}\n  .mband.bbm,.mband.bmute{background:#e6dcc8; color:var(--muted);}\n\n  /* 오가닉 vs 협찬 */\n  .vs{padding:12px 2px;} .vs + .vs{border-top:1px solid var(--line);}\n  .vs-h{font-size:13px; font-weight:900; color:var(--ink); margin-bottom:9px; display:flex; align-items:center; gap:9px;}\n  .vs-mult{font-size:11px; font-weight:900; color:#fff; background:var(--coral); padding:3px 9px; border-radius:20px;}\n  .vs-row{display:grid; grid-template-columns:52px 1fr 72px; align-items:center; gap:10px; margin:5px 0;}\n  .vs-tag{font-size:11px; font-weight:900; text-align:center; padding:3px 0; border-radius:6px;}\n  .vs-tag.org{background:#dff0e9; color:#0f6b47;} .vs-tag.ad{background:#ffe1dc; color:#c0392b;}\n  .vs-bar{height:20px; background:#efe6d3; border-radius:7px; overflow:hidden;}\n  .vs-fill{display:block; height:100%; border-radius:7px;}\n  .vs-fill.org{background:var(--mint);} .vs-fill.ad{background:var(--coral);}\n  .vs-val{text-align:right; font-weight:900; font-size:14px; letter-spacing:-.02em;}\n\n  /* 백분위 스펙트럼 */\n  .specrows{display:flex; flex-direction:column; gap:16px;}\n  .spec{background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:15px 18px 12px;}\n  .spec-top{display:flex; align-items:center; gap:10px; margin-bottom:12px;}\n  .spec-lab{font-size:13.5px; font-weight:800; color:#4a4436;}\n  .spec-val{margin-left:auto; font-size:20px; font-weight:900; letter-spacing:-.03em; color:var(--ink);}\n  .spec-track{position:relative; height:10px; background:#ece2cf; border-radius:6px;}\n  .spec-fill{position:absolute; left:0; top:0; height:100%; border-radius:6px; background:var(--navy); opacity:.16;}\n  .spec-med{position:absolute; left:50%; top:-3px; width:2px; height:16px; background:var(--muted); opacity:.5; transform:translateX(-50%);}\n  .spec-dot{position:absolute; top:50%; width:16px; height:16px; border-radius:50%; background:var(--coral);\n    border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35); transform:translate(-50%,-50%);}\n  .spec-ends{display:flex; justify-content:space-between; margin-top:7px; font-size:10.5px; font-weight:700; color:var(--muted);}\n\n  /* 성장 모멘텀 */\n  .growthead{display:flex; align-items:center; gap:20px; margin-top:8px;}\n  .growthead-num{font-size:46px; font-weight:900; letter-spacing:-.04em; line-height:1;}\n  .growthead-num.gtop{color:#159b7a;} .growthead-num.gmid{color:var(--navy);} .growthead-num.gbot{color:var(--coral);}\n  .gbadge{display:inline-block; font-size:13px; font-weight:900; padding:6px 14px; border-radius:20px;}\n  .gbadge.gtop{background:var(--mint); color:#0f3b30;} .gbadge.gmid{background:var(--navy); color:#fff;} .gbadge.gbot{background:#ffe1dc; color:#c0392b;}\n  .growthead-sub{font-size:12.5px; font-weight:700; color:var(--muted); margin-top:8px;} .growthead-sub b{color:#4a4436;}\n  .distrack{position:relative; height:14px; border-radius:8px; margin-top:26px; background:#ece2cf; overflow:hidden;}\n  .dz{position:absolute; top:0; height:100%;}\n  .dz-lo{background:#f3d9d2;} .dz-mid{background:#e6dcc8;} .dz-hi{background:#cfe7dd;}\n  .dtick{position:absolute; top:-4px; width:2px; height:22px; background:var(--muted); opacity:.55; transform:translateX(-50%);}\n  .dmark{position:absolute; top:50%; width:18px; height:18px; border-radius:50%; background:var(--navy);\n    border:3px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.4); transform:translate(-50%,-50%); z-index:2;}\n  .distlabels{display:flex; justify-content:space-between; margin-top:9px; font-size:10.5px; font-weight:800; color:var(--muted);}\n\n  /* 게이지 큰 숫자 */\n  .bignum{display:flex; gap:14px; flex-wrap:wrap; margin-top:6px;}\n  .bignum .g{flex:1; min-width:150px; text-align:center; border-radius:16px; padding:20px 14px; background:var(--card); border:1.5px solid var(--line);}\n  .bignum .g .b{font-size:34px; font-weight:900; letter-spacing:-.04em; line-height:1; color:var(--navy);}\n  .bignum .g .c{font-size:11.5px; font-weight:800; margin-top:9px; color:var(--muted);}\n\n  /* 썸네일 포스트 */\n  .postgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px;}\n  .pcard{background:var(--card); border:1.5px solid var(--line); border-radius:16px; overflow:hidden;\n    text-decoration:none; color:inherit; transition:.18s; display:flex; flex-direction:column;}\n  .pcard:hover{transform:translateY(-3px); box-shadow:0 12px 26px -14px rgba(0,0,0,.5); border-color:var(--navy);}\n  .pcard .thumb{position:relative; aspect-ratio:4/5; background:var(--navy); background-size:cover; background-position:center;}\n  .pcard .thumb .rk{position:absolute; top:8px; left:8px; width:26px; height:26px; border-radius:8px; background:var(--coral);\n    color:#fff; font-weight:900; font-size:13px; display:flex; align-items:center; justify-content:center;}\n  .pcard .thumb .tags{position:absolute; top:8px; right:8px; display:flex; gap:4px;}\n  .pcard .thumb .tg{font-size:9.5px; font-weight:900; padding:3px 6px; border-radius:5px; color:#fff; background:rgba(0,0,0,.55);}\n  .pcard .thumb .views{position:absolute; left:0; right:0; bottom:0; padding:14px 10px 8px; color:#fff; font-weight:900; font-size:14px;\n    background:linear-gradient(transparent, rgba(0,0,0,.72));}\n  .pcard .cap{padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px;}\n  .pcard .cap-txt{font-size:11.5px; line-height:1.5; font-weight:600; color:#4a4436;\n    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}\n  .pcard .st{color:var(--muted); font-weight:800; font-size:10.5px;}\n\n  .brands{display:flex; flex-wrap:wrap; gap:10px;}\n  .brand{display:flex; align-items:center; gap:9px; background:var(--card); border:1.5px solid var(--line);\n    border-radius:14px; padding:9px 15px 9px 9px; font-size:13px; font-weight:800;}\n  .brand .lg{width:34px; height:34px; border-radius:10px; background-size:cover; background-position:center;\n    background-color:var(--cream); flex:none;}\n  .brand small{display:block; font-size:10.5px; color:var(--muted); font-weight:700;}\n\n  .htags{display:flex; flex-wrap:wrap; gap:8px;}\n  .htag{font-size:14px; font-weight:900; color:var(--navy);}\n  .htag::before{content:\"#\"; color:var(--coral);}\n\n  .foot{background:var(--navy); color:rgba(245,241,232,.6); text-align:center;\n    font-size:11.5px; font-weight:700; padding:24px; letter-spacing:.03em;}\n  .foot b{color:var(--butter);}\n</style>\n</head>\n<body>\n<div class=\"page\">\n\n  <!-- ============================ 커버 ============================ -->\n  <div class=\"panel navy cover\">\n    <div class=\"kicker\">WHY THIS CREATOR · 왜 지금 이 크리에이터인가</div>\n    <h1 class=\"ptitle h\">{{INSIGHT:lead_headline}}</h1>\n    <div class=\"who\">\n      <div class=\"ava\" style=\"background-image:url('{{profile.profile_picture_url}}')\"></div>\n      <div>\n        <div class=\"n\">{{profile.username}} · @{{profile.user_id}}</div>\n        <!-- OPTIONAL_BLOCK: identity --><div class=\"g\">{{identity.user_type_label}} · {{identity.topic_label}}</div><!-- /OPTIONAL_BLOCK -->\n      </div>\n      <div class=\"links\">\n        <!-- REPEAT: external_urls --><a href=\"{{this}}\" target=\"_blank\" rel=\"noopener\">{{this_short}}</a><!-- /REPEAT -->\n      </div>\n    </div>\n    <p class=\"cover-claim\">{{INSIGHT:identity_claim_body}}</p>\n    <div class=\"strip\">\n      <div class=\"cell\">\n        <span class=\"v\">{{format_compact profile.followers}}</span><span class=\"l\">팔로워</span>\n        <!-- OPTIONAL_BLOCK: follower_trend --><svg class=\"spark\" viewBox=\"0 0 600 100\" preserveAspectRatio=\"none\"><polyline points=\"{{sparkline_points profile.follower_trend}}\" fill=\"none\" stroke=\"#ffce3a\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><!-- /OPTIONAL_BLOCK -->\n      </div>\n      <div class=\"cell\"><span class=\"v\">{{format_compact profile.following}}</span><span class=\"l\">팔로잉</span></div>\n      <div class=\"cell\"><span class=\"v\">{{format_compact profile.posts}}</span><span class=\"l\">게시물</span></div>\n      <!-- OPTIONAL_BLOCK: benchmark_rate --><div class=\"cell\"><span class=\"v\">{{format_percent benchmark.recent_engagement_rate}}</span><span class=\"l\">최근 참여율</span></div><!-- /OPTIONAL_BLOCK -->\n    </div>\n  </div>\n\n  <!-- ============================ 1차: AI 강조 3가지 + 근거 ============================ -->\n  <!-- SLOT: primary -->\n\n  <!-- ============================ 2차: 그 외 데이터 ============================ -->\n  <!-- SLOT: secondary -->\n\n  <!-- ============================ 마무리 ============================ -->\n  <div class=\"panel navy\">\n    <div class=\"kicker\">그래서, 이 크리에이터와</div>\n    <h2 class=\"ptitle h\">한 문장으로 요약하면</h2>\n    <p class=\"pbody\">{{INSIGHT:closing}}</p>\n  </div>\n\n  <div class=\"foot\">이 리포트는 <b>Hifen</b> 데이터를 기반으로 자동 생성되었습니다.</div>\n</div>\n\n<!-- ===== 근거 블록 풀 (assemble가 데이터 채운 뒤 추출·재배치, 원본은 제거) ===== -->\n<div id=\"evpool\" style=\"display:none\">\n\n  <!-- EVIDENCE: identity -->\n    <div class=\"sub\"><span class=\"tick\"></span>콘텐츠 성격 · 독립 점수</div>\n    <div class=\"cardbox\"><div class=\"rank o\">\n      <!-- REPEAT: identity.content_function --><div class=\"r\"><span class=\"lab\">{{key}}</span><span class=\"track\"><span class=\"bar-fill\" style=\"width:{{score}}%\"></span></span><span class=\"pc\">{{score}}</span></div><!-- /REPEAT -->\n    </div></div>\n    <div class=\"sub\"><span class=\"tick\"></span>무드 · 페르소나 · 토픽</div>\n    <div class=\"cols3\">\n      <div class=\"cardbox\"><div class=\"bt\">무드</div><div class=\"rank b\"><!-- REPEAT: identity.mood_axes --><div class=\"r\"><span class=\"lab\">{{key}}</span><span class=\"track\"><span class=\"bar-fill\" style=\"width:{{score}}%\"></span></span><span class=\"pc\">{{score}}</span></div><!-- /REPEAT --></div></div>\n      <div class=\"cardbox\"><div class=\"bt\">페르소나</div><div class=\"rank a\"><!-- REPEAT: identity.persona_axes --><div class=\"r\"><span class=\"lab\">{{key}}</span><span class=\"track\"><span class=\"bar-fill\" style=\"width:{{score}}%\"></span></span><span class=\"pc\">{{score}}</span></div><!-- /REPEAT --></div></div>\n      <div class=\"cardbox\"><div class=\"bt\">토픽</div><div class=\"rank\"><!-- REPEAT: identity.topic_axes --><div class=\"r\"><span class=\"lab\">{{key}}</span><span class=\"track\"><span class=\"bar-fill\" style=\"width:{{score}}%\"></span></span><span class=\"pc\">{{score}}</span></div><!-- /REPEAT --></div></div>\n    </div>\n    <div class=\"eg\"><b>이 조합이 만드는 화면은</b> — {{INSIGHT:signature_read}}</div>\n    <!-- OPTIONAL_BLOCK: keywords --><div class=\"sub\"><span class=\"tick\"></span>이 계정을 설명하는 키워드</div><div class=\"kwcloud\"><!-- REPEAT: keywords --><span class=\"kw\">{{this}}</span><!-- /REPEAT --></div><!-- /OPTIONAL_BLOCK -->\n  <!-- /EVIDENCE -->\n\n  <!-- EVIDENCE: audience -->\n    <!-- OPTIONAL_BLOCK: aud_head --><div class=\"audhero\">주력 오디언스는 <b>{{metrics.primary_age}} {{metrics.primary_gender_kr}}</b> — 전체의 <b>{{metrics.primary_audience_ratio}}%</b></div><!-- /OPTIONAL_BLOCK -->\n    <div class=\"sub\"><span class=\"tick\"></span>팔로워 성별</div>\n    <div class=\"splitbar\">\n      <span class=\"seg-fill\" style=\"width:{{audience.gender_female_percent}}%; background:var(--coral)\">여성 {{audience.gender_female_percent}}%</span>\n      <span class=\"seg-fill\" style=\"width:{{audience.gender_male_percent}}%; background:var(--navy)\">남성 {{audience.gender_male_percent}}%</span>\n    </div>\n    <div class=\"sub\"><span class=\"tick\"></span>연령대 분포</div>\n    <div class=\"stackbar\">\n      <span class=\"seg-fill\" style=\"width:{{audience.age_13_17}}%; background:var(--seq1); color:#2a3550\">{{audience.age_13_17}}</span>\n      <span class=\"seg-fill\" style=\"width:{{audience.age_18_24}}%; background:var(--seq3)\">{{audience.age_18_24}}</span>\n      <span class=\"seg-fill\" style=\"width:{{audience.age_25_34}}%; background:var(--seq5)\">{{audience.age_25_34}}</span>\n      <span class=\"seg-fill\" style=\"width:{{audience.age_35_44}}%; background:var(--seq6)\">{{audience.age_35_44}}</span>\n      <span class=\"seg-fill\" style=\"width:{{audience.age_45_54}}%; background:var(--seq7)\">{{audience.age_45_54}}</span>\n      <span class=\"seg-fill\" style=\"width:{{audience.age_55_64}}%; background:#0d1a2e\"></span>\n      <span class=\"seg-fill\" style=\"width:{{audience.age_65_plus}}%; background:#070f1c\"></span>\n    </div>\n    <div class=\"stacklabels\">\n      <span><i style=\"background:var(--seq1)\"></i>13–17 {{audience.age_13_17}}%</span>\n      <span><i style=\"background:var(--seq3)\"></i>18–24 {{audience.age_18_24}}%</span>\n      <span><i style=\"background:var(--seq5)\"></i>25–34 {{audience.age_25_34}}%</span>\n      <span><i style=\"background:var(--seq6)\"></i>35–44 {{audience.age_35_44}}%</span>\n      <span><i style=\"background:var(--seq7)\"></i>45–54 {{audience.age_45_54}}%</span>\n    </div>\n    <div class=\"sub\"><span class=\"tick\"></span>주요 도달 국가</div>\n    <div class=\"chips\"><!-- REPEAT: audience.target_countries --><span class=\"chip\">{{this}}</span><!-- /REPEAT --></div>\n    <div class=\"eg\"><b>팔로워 한 명을 상상하면</b> — {{INSIGHT:audience_persona}}</div>\n  <!-- /EVIDENCE -->\n\n  <!-- EVIDENCE: performance -->\n    <!-- OPTIONAL_BLOCK: versus -->\n    <div class=\"sub\"><span class=\"tick\"></span>오가닉 vs 협찬 · 릴스 정면 비교</div>\n    <div class=\"cardbox\">\n      <!-- REPEAT: metrics_versus --><div class=\"vs\">\n        <div class=\"vs-h\">{{label}}<span class=\"vs-mult\">오가닉 ×{{mult}}</span></div>\n        <div class=\"vs-row\"><span class=\"vs-tag org\">오가닉</span><span class=\"vs-bar\"><span class=\"vs-fill org bar-fill\" style=\"width:{{org_w}}%\"></span></span><span class=\"vs-val\">{{org_val}}</span></div>\n        <div class=\"vs-row\"><span class=\"vs-tag ad\">협찬</span><span class=\"vs-bar\"><span class=\"vs-fill ad bar-fill\" style=\"width:{{ad_w}}%\"></span></span><span class=\"vs-val\">{{ad_val}}</span></div>\n      </div><!-- /REPEAT -->\n    </div>\n    <!-- /OPTIONAL_BLOCK -->\n    <div class=\"sub\"><span class=\"tick\"></span>동종 크리에이터 사이에서 이 계정의 위치</div>\n    <div class=\"specrows\">\n      <!-- REPEAT: metrics_spectrum --><div class=\"spec\">\n        <div class=\"spec-top\"><span class=\"spec-lab\">{{label}}</span><span class=\"spec-val\">{{value}}</span><span class=\"mband {{band_class}}\">{{band_label}}</span></div>\n        <div class=\"spec-track\"><span class=\"spec-med\"></span><span class=\"spec-fill\" style=\"width:{{pct}}%\"></span><span class=\"spec-dot\" style=\"left:{{pct}}%\"></span></div>\n        <div class=\"spec-ends\"><span>하위</span><span>중앙값</span><span>상위</span></div>\n      </div><!-- /REPEAT -->\n    </div>\n    <div class=\"win\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--coral)\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 17l6-6 4 4 8-8\"/><path d=\"M21 7v6h-6\"/></svg><div>{{INSIGHT:content_read}}</div></div>\n  <!-- /EVIDENCE -->\n\n  <!-- EVIDENCE: growth -->\n    <div class=\"sub\"><span class=\"tick\"></span>같은 팔로워대 또래 대비 3개월 성장률</div>\n    <div class=\"growthead\">\n      <div class=\"growthead-num {{growth.grade_class}}\">{{growth.rate}}</div>\n      <div>\n        <span class=\"gbadge {{growth.grade_class}}\">{{growth.grade_label}}</span>\n        <div class=\"growthead-sub\">동급 구간 <b>{{growth.band}}</b> · 또래 {{growth.band_users}}명 대비</div>\n      </div>\n    </div>\n    <div class=\"distrack\">\n      <span class=\"dz dz-lo\" style=\"left:0; width:{{growth.lo_w}}%\"></span>\n      <span class=\"dz dz-mid\" style=\"left:{{growth.p20_pos}}%; width:{{growth.mid_w}}%\"></span>\n      <span class=\"dz dz-hi\" style=\"left:{{growth.p80_pos}}%; width:{{growth.hi_w}}%\"></span>\n      <span class=\"dtick\" style=\"left:{{growth.p20_pos}}%\"></span>\n      <span class=\"dtick\" style=\"left:{{growth.p50_pos}}%\"></span>\n      <span class=\"dtick\" style=\"left:{{growth.p80_pos}}%\"></span>\n      <span class=\"dmark\" style=\"left:{{growth.user_pos}}%\"></span>\n    </div>\n    <div class=\"distlabels\"><span>하위권</span><span>p20 {{growth.p20}}</span><span>중앙 {{growth.p50}}</span><span>p80 {{growth.p80}}</span><span>상위권</span></div>\n    <div class=\"win\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--coral)\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 17l6-6 4 4 8-8\"/><path d=\"M21 7v6h-6\"/></svg><div>{{growth.verdict}}</div></div>\n  <!-- /EVIDENCE -->\n\n  <!-- EVIDENCE: brands -->\n    <!-- OPTIONAL_BLOCK: collaborations --><div class=\"sub\"><span class=\"tick\"></span>이미 브랜드가 검증한 계정</div>\n    <div class=\"brands\"><!-- REPEAT: collaborations --><div class=\"brand\"><span class=\"lg\" style=\"background-image:url('{{brand_logo_url}}')\"></span><div>{{brand_name_kr}}<small>{{topic}}</small></div></div><!-- /REPEAT --></div><!-- /OPTIONAL_BLOCK -->\n    <!-- OPTIONAL_BLOCK: ad_industry --><div class=\"sub\"><span class=\"tick\"></span>광고 이력 · 주력 산업 {{metrics.primary_ad_industry_ratio}}%</div>\n    <div class=\"chips\"><span class=\"chip on\">{{metrics.primary_ad_industry}}</span><!-- REPEAT: ad_industries --><span class=\"chip\">{{this}}</span><!-- /REPEAT --></div><!-- /OPTIONAL_BLOCK -->\n    <!-- OPTIONAL_BLOCK: ppl_ranking --><div class=\"sub\"><span class=\"tick\"></span>PPL 노출 랭킹 (최근 90일 · 조회순)</div>\n    <div class=\"bignum\"><!-- REPEAT: ppl_ranking --><div class=\"g\"><div class=\"b\">{{total_ppl_count}}건</div><div class=\"c\">{{topic}} · {{format_compact total_views}} 조회</div></div><!-- /REPEAT --></div><!-- /OPTIONAL_BLOCK -->\n  <!-- /EVIDENCE -->\n\n  <!-- EVIDENCE: content_mix -->\n    <!-- OPTIONAL_BLOCK: content_mix -->\n    <div class=\"sub\"><span class=\"tick\"></span>콘텐츠 믹스 (최근 게시물 기준)</div>\n    <div class=\"splitbar\">\n      <span class=\"seg-fill\" style=\"width:{{metrics.reel_share_pct}}%; background:var(--coral)\">릴스 {{metrics.reel_share_pct}}%</span>\n      <span class=\"seg-fill\" style=\"width:{{metrics.feed_share_pct}}%; background:var(--navy)\">피드 {{metrics.feed_share_pct}}%</span>\n    </div>\n    <div class=\"sub\"><span class=\"tick\"></span>최신 발행일</div>\n    <div class=\"bignum\">\n      <div class=\"g\"><div class=\"b\" style=\"font-size:20px\">{{metrics.latest_reel_date}}</div><div class=\"c\">최근 릴스</div></div>\n      <div class=\"g\"><div class=\"b\" style=\"font-size:20px\">{{metrics.latest_feed_date}}</div><div class=\"c\">최근 피드</div></div>\n    </div>\n    <!-- /OPTIONAL_BLOCK -->\n  <!-- /EVIDENCE -->\n\n  <!-- EVIDENCE: top_posts -->\n    <div class=\"sub\"><span class=\"tick\"></span>가장 반응이 좋았던 게시물</div>\n    <div class=\"postgrid\">\n      <!-- REPEAT: top_posts --><a class=\"pcard\" href=\"{{url}}\" target=\"_blank\" rel=\"noopener\">\n        <div class=\"thumb\" style=\"background-image:url('{{thumbnail}}')\">\n          <span class=\"rk\">{{rank}}</span>\n          <span class=\"tags\">{{#if is_reel}}<span class=\"tg\" style=\"background:var(--coral)\">릴스</span>{{/if}}{{#if is_sponsored_or_ppl}}<span class=\"tg\" style=\"background:var(--butter);color:#3a2c00\">협찬</span>{{/if}}</span>\n          <span class=\"views\">조회 {{format_compact views}}</span>\n        </div>\n        <div class=\"cap\"><p class=\"cap-txt\">{{description}}</p><span class=\"st\">좋아요 {{format_compact likes}} · 댓글 {{format_compact comments}}</span></div>\n      </a><!-- /REPEAT -->\n    </div>\n  <!-- /EVIDENCE -->\n\n  <!-- EVIDENCE: hashtags -->\n    <div class=\"sub\"><span class=\"tick\"></span>대표 해시태그</div>\n    <div class=\"cardbox\"><div class=\"htags\"><!-- REPEAT: top_hashtags --><span class=\"htag\">{{this}}</span><!-- /REPEAT --></div></div>\n  <!-- /EVIDENCE -->\n\n</div>\n</body>\n</html>\n"


          KR_LABELS = {
              "human_influencer": "휴먼 인플루언서", "official_brand_account": "공식 브랜드 계정",
              "media_power_page": "미디어 파워페이지", "commerce_seller": "커머스 셀러",
              "community_theme_page": "커뮤니티/테마 페이지", "illustration_webtoon": "일러스트/웹툰",
              "promotion": "홍보/광고", "review": "리뷰", "daily_life": "일상", "tip_and_howto": "팁/노하우",
              "routine": "루틴", "entertainment": "엔터테인먼트", "quration": "큐레이션",
              "beauty": "뷰티", "food": "푸드", "family": "가족", "tech": "테크", "health_medical": "건강/의료",
              "interior": "인테리어", "hobby_leisure": "취미/레저", "fashion": "패션", "art": "아트",
              "relationship": "관계", "travel": "여행", "education_career": "교육/커리어", "pet": "펫",
              "sports": "스포츠", "automobile": "자동차", "game": "게임", "sensual": "감성", "religion": "종교",
              "social_politics_economy": "사회/정치/경제",
              "natural": "자연스러움", "bright": "화사함", "minimal": "미니멀", "emotional": "감성적",
              "urban_chic": "어반시크", "cute": "귀여움", "luxury": "럭셔리", "humor": "유머", "dark": "다크", "street": "스트릿",
              "face_center": "얼굴 중심", "product_center": "제품 중심", "info_content_center": "정보성 콘텐츠 중심",
              "family_center": "가족 중심", "voice_center": "보이스 중심", "pet_center": "반려동물 중심",
          }
          COUNTRY_LABELS = {
              "KR": "대한민국", "US": "미국", "PT": "포르투갈", "JP": "일본", "VN": "베트남", "TH": "태국",
              "PH": "필리핀", "ID": "인도네시아", "CN": "중국", "TW": "대만", "SG": "싱가포르", "MY": "말레이시아",
          }
          DIRECTION_LABELS = {"improving": "▲ 상승세", "declining": "▼ 하락세", "stable": "— 안정"}


          def format_compact(v) -> str:
              if v is None:
                  return "-"
              v = int(round(float(v)))
              if v < 10_000:
                  return f"{v:,}"
              if v < 100_000_000:
                  return f"{round(v / 10_000, 1)}만"
              return f"{round(v / 100_000_000, 1)}억"


          def format_percent(v) -> str:
              if v is None:
                  return "-"
              return f"{round(float(v) * 100, 1)}%"


          def _int_str(v) -> str:
              return str(int(round(float(v)))) if v is not None else "-"


          # ugwanggi 백분위 등급 → (칩 라벨, CSS 클래스)
          BAND = {
              "TOP_5": ("TOP 5%", "b5"), "TOP_10": ("TOP 10%", "b10"), "TOP_25": ("TOP 25%", "b25"),
              "ABOVE_MEDIAN": ("평균 이상", "bam"), "BELOW_MEDIAN": ("평균 이하", "bbm"),
          }

          def _fmt_metric(val, fmt):
              if fmt == "compact":
                  return format_compact(val)
              if fmt == "pct":
                  return f"{round(float(val), 1)}%"
              if fmt == "int":
                  return f"{int(round(float(val))):,}"
              return f"{round(float(val), 1)}"  # num1


          # 오가닉 vs 협찬 릴스 정면 비교: (라벨, 오가닉 키, 협찬 키, 포맷)
          _VERSUS_SPECS = [
              ("평균 조회", "avg_views_last_10_org_reel", "avg_views_last_10_ad_reel", "compact"),
              ("릴스 참여율", "engagement_pct_last_10_org_reel", "engagement_pct_last_10_ad_reel", "pct"),
          ]

          # 동종 대비 위치 스펙트럼: (라벨, metrics 키, 포맷). 값 null이면 생략.
          _SPEC_SPECS = [
              ("오가닉 릴스 · 평균 조회", "avg_views_last_10_org_reel", "compact"),
              ("오가닉 피드 · 평균 좋아요", "avg_likes_last_10_org_feed", "compact"),
              ("오가닉 피드 · 평균 댓글", "avg_comments_last_10_org_feed", "int"),
              ("오가닉 피드 · 참여율", "engagement_pct_last_10_org_feed", "pct"),
              ("팔로워/팔로잉 비율", "follower_following_ratio", "num1"),
          ]


          def _metric_versus(m: dict):
              rows = []
              for label, ok, ak, fmt in _VERSUS_SPECS:
                  o, a = m.get(ok), m.get(ak)
                  if o is None or a is None:
                      continue
                  o, a = float(o), float(a)
                  mx = max(o, a) or 1.0
                  rows.append({
                      "label": label, "org_val": _fmt_metric(o, fmt), "ad_val": _fmt_metric(a, fmt),
                      "org_w": str(round(o / mx * 100)), "ad_w": str(round(a / mx * 100)),
                      "mult": str(round(o / a, 1)) if a else "-",
                  })
              return rows


          def _metric_spectrum(m: dict):
              rows = []
              for label, key, fmt in _SPEC_SPECS:
                  val = m.get(key)
                  if val is None:
                      continue
                  p = m.get(key + "_percentile")
                  blabel, bclass = BAND.get(m.get(key + "_percentile_band"), ("—", "bmute"))
                  rows.append({
                      "label": label, "value": _fmt_metric(val, fmt),
                      "pct": str(int(round(float(p)))) if p is not None else "0",
                      "band_label": blabel, "band_class": bclass,
                  })
              return rows


          def sparkline_points(series, lo=None, hi=None) -> str:
              vals = [v for v in series]
              n = len(vals)
              if n == 0:
                  return ""
              lo = min(vals) if lo is None else lo
              hi = max(vals) if hi is None else hi
              pts = []
              for i, v in enumerate(vals):
                  x = 8 + i * (584 / max(n - 1, 1))
                  y = 50 if hi == lo else 92 - ((v - lo) / (hi - lo)) * 84
                  pts.append(f"{x:.1f},{y:.1f}")
              return " ".join(pts)


          def short_url(u: str) -> str:
              s = re.sub(r"^https?://", "", u or "").rstrip("/")
              s = re.sub(r"^www\.", "", s)
              return s if len(s) <= 30 else s[:29] + "…"


          _HDR_RE = re.compile(r"^\s*#{1,6}\s*")
          _HR_RE = re.compile(r"^\s*[-*_]{3,}\s*$")


          def clean_insight(text: str, slot: str = "") -> str:
              """LLM 출력에서 마크다운 누출을 제거한다(원래 파이프라인의 상습 사고).
              - 줄머리 마크다운 헤더(#, ##…) 제거
              - 구분선(---, ***, ___) 줄 삭제
              - 슬롯 이름/영문 라벨만 있는 줄 삭제(예: 'audience_persona', 'CLOSING:')
              - 3줄 이상 연속 공백을 2줄로 축소
              """
              out = []
              for ln in (text or "").splitlines():
                  s = ln.strip()
                  if _HR_RE.match(s):
                      continue
                  s2 = _HDR_RE.sub("", s)  # 헤더 기호 제거
                  if s2 and s2.lower().replace(" ", "_") == slot.lower():
                      continue  # 슬롯 이름만 있는 라벨 줄
                  out.append(_HDR_RE.sub("", ln))
              t = "\n".join(out).strip()
              return re.sub(r"\n{3,}", "\n\n", t)


          def markers(text: str, slot: str = "") -> str:
              """살균 후 *강조구* → 형광펜 마커. 남은 홑 별표는 제거(누출 방지)."""
              t = re.sub(r"\*([^*]+)\*", r'<span class="mk-c">\1</span>', clean_insight(text, slot))
              return t.replace("*", "")


          def _replace_repeat(html: str, marker: str, items, build_row) -> str:
              pattern = re.compile(rf"<!-- REPEAT: {re.escape(marker)}[^>]*-->(.*?)<!-- /REPEAT -->", re.S)
              m = pattern.search(html)
              if not m:
                  return html
              row_tpl = m.group(1)
              rows = "".join(build_row(row_tpl, item, idx) for idx, item in enumerate(items))
              return pattern.sub(lambda _m: rows, html, count=1)


          def _strip_marked(html: str, kind: str, name: str, keep: bool) -> str:
              pattern = re.compile(rf"<!-- {kind}: {re.escape(name)} -->(.*?)<!-- /{kind} -->", re.S)
              if keep:
                  return pattern.sub(lambda m: m.group(1), html)
              return pattern.sub("", html)


          _IF_PATTERN = re.compile(r"\{\{#if (\w+)\}\}(.*?)\{\{/if\}\}", re.S)


          def _render_conditionals(text: str, conditions: dict) -> str:
              def resolve(m: "re.Match") -> str:
                  tag, body = m.group(1), m.group(2)
                  cond = conditions.get(tag, False)
                  if "{{else}}" in body:
                      true_part, false_part = body.split("{{else}}", 1)
                      return true_part if cond else false_part
                  return body if cond else ""

              return _IF_PATTERN.sub(resolve, text)


          def _parse_identity_claim(text: str):
              title, body = "", ""
              for line in (text or "").splitlines():
                  line = line.strip()
                  if line.startswith("CLAIM:"):
                      title = line[len("CLAIM:"):].strip()
                  elif line.startswith("BODY:"):
                      body = line[len("BODY:"):].strip()
              if not title:
                  title = (text or "").strip()
              return title, body


          EVIDENCE_IDS = ["identity", "audience", "performance", "content_mix", "brands", "growth", "top_posts", "hashtags"]


          def _parse_ai_highlights(text: str):
              """`HIGHLIGHT: 제목 | 본문 | 한줄임팩트 | evidence:id1,id2` ×3.
              4번째 칸은 이 강조점을 뒷받침하는 근거 블록 id들(EVIDENCE_IDS 중). 없거나 부족하면 빈칸/빈리스트."""
              items = []
              for line in (text or "").splitlines():
                  line = line.strip()
                  if line.startswith("HIGHLIGHT:"):
                      parts = [p.strip() for p in line[len("HIGHLIGHT:"):].split("|")]
                      while len(parts) < 4:
                          parts.append("")
                      title, body, sowhat, ev = parts[0], parts[1], parts[2], parts[3]
                      if ev.lower().startswith("evidence:"):
                          ev = ev[len("evidence:"):]
                      ev_ids = [e.strip() for e in re.split(r"[,\s]+", ev) if e.strip() in EVIDENCE_IDS]
                      items.append((title, body, sowhat, ev_ids))
              while len(items) < 3:
                  items.append(("", "", "", []))
              return items[:3]


          def main(
              report_json: str,
              lead_headline: str,
              identity_claim: str,
              ai_highlights: str,
              audience_persona: str,
              content_read: str,
              closing: str,
              signature_read: str,
          ) -> dict:
              data = json.loads(report_json)
              out = TEMPLATE_HTML

              # ---- profile ----
              p = data["profile"]
              out = out.replace("{{profile.username}}", p.get("username") or p["user_id"])
              out = out.replace("{{profile.user_id}}", p["user_id"])
              out = out.replace("{{profile.profile_picture_url}}", p.get("profile_picture_url") or "")
              out = out.replace("{{profile.description}}", (p.get("description") or "").replace("\n", "&#10;"))
              out = out.replace("{{format_compact profile.followers}}", format_compact(p["followers"]))
              out = out.replace("{{format_compact profile.following}}", format_compact(p["following"]))
              out = out.replace("{{format_compact profile.posts}}", format_compact(p["posts"]))

              trend = p.get("follower_trend") or []
              out = _strip_marked(out, "OPTIONAL_BLOCK", "follower_trend", keep=len(trend) >= 2)
              if len(trend) >= 2:
                  out = out.replace("{{sparkline_points profile.follower_trend}}",
                                    sparkline_points([t["followers"] for t in trend]))

              out = _replace_repeat(
                  out, "external_urls", p.get("external_urls") or [],
                  lambda tpl, item, _i: tpl.replace("{{this_short}}", short_url(item)).replace("{{this}}", item),
              )

              # ---- insight slots (모두 살균) ----
              out = out.replace("{{INSIGHT:lead_headline}}", markers(lead_headline, "lead_headline"))

              claim_title, claim_body = _parse_identity_claim(identity_claim)
              out = out.replace("{{INSIGHT:identity_claim_title}}", markers(claim_title))
              out = out.replace("{{INSIGHT:identity_claim_body}}", clean_insight(claim_body))

              highlights = _parse_ai_highlights(ai_highlights)  # 재배치 단계에서 카드로 생성

              out = out.replace("{{INSIGHT:audience_persona}}", clean_insight(audience_persona, "audience_persona"))
              out = out.replace("{{INSIGHT:content_read}}", clean_insight(content_read, "content_read"))
              out = out.replace("{{INSIGHT:closing}}", clean_insight(closing, "closing"))
              out = out.replace("{{INSIGHT:signature_read}}", clean_insight(signature_read, "signature_read"))

              # ---- identity ----
              idn = data.get("identity")
              out = _strip_marked(out, "OPTIONAL_BLOCK", "identity", keep=idn is not None)  # 커버의 정체성 한 줄
              if idn:
                  out = out.replace("{{identity.user_type_label}}", idn["user_type_label"])
                  out = out.replace("{{identity.topic_label}}", idn["topic_label"])
                  out = out.replace("{{identity.user_type_confidence}}", str(idn["user_type_confidence"]))

                  def axes_rows(tpl, item, _idx):
                      label = KR_LABELS.get(item["key"], item["key"])
                      return tpl.replace("{{key}}", label).replace("{{score}}", str(item["score"]))

                  out = _replace_repeat(out, "identity.content_function", (idn.get("content_function") or [])[:6], axes_rows)
                  out = _replace_repeat(out, "identity.mood_axes", (idn.get("mood_axes") or [])[:5], axes_rows)
                  out = _replace_repeat(out, "identity.persona_axes", (idn.get("persona_axes") or [])[:5], axes_rows)
                  out = _replace_repeat(out, "identity.topic_axes", (idn.get("topic_axes") or [])[:5], axes_rows)

              # ---- audience ----
              aud = data.get("audience")
              if aud:
                  out = out.replace("{{audience.gender_male_percent}}", str(aud["gender_male_percent"]))
                  out = out.replace("{{audience.gender_female_percent}}", str(aud["gender_female_percent"]))
                  for k in ["age_13_17", "age_18_24", "age_25_34", "age_35_44", "age_45_54", "age_55_64", "age_65_plus"]:
                      out = out.replace("{{audience." + k + "}}", str(aud[k]))
                  out = _replace_repeat(
                      out, "audience.target_countries", aud.get("target_countries") or [],
                      lambda tpl, item, _i: tpl.replace("{{this}}", COUNTRY_LABELS.get(item, item)),
                  )

              # ---- cover: 최근 참여율 (DB benchmark 값만 커버 스트립에 사용) ----
              bm = data.get("benchmark")
              has_rate = bm is not None and bm.get("recent_engagement_rate") is not None
              out = _strip_marked(out, "OPTIONAL_BLOCK", "benchmark_rate", keep=has_rate)
              if has_rate:
                  out = out.replace("{{format_percent benchmark.recent_engagement_rate}}", format_percent(bm.get("recent_engagement_rate")))

              # ---- 수치 지표: ugwanggi metrics (백분위 계산값) ----
              m = data.get("metrics")
              out = _strip_marked(out, "OPTIONAL_BLOCK", "content_mix", keep=bool(m))
              # 키워드/오디언스 헤드라인 (identity·audience 카드 안에 있지만 metrics 기반) — m 여부와 무관하게 마커 정리
              kw = (m or {}).get("keywords") or []
              out = _strip_marked(out, "OPTIONAL_BLOCK", "keywords", keep=len(kw) > 0)
              aud_head_ok = bool(m and m.get("primary_age"))
              out = _strip_marked(out, "OPTIONAL_BLOCK", "aud_head", keep=aud_head_ok)
              if kw:
                  out = _replace_repeat(out, "keywords", kw[:18], lambda tpl, it, _i: tpl.replace("{{this}}", str(it)))
              if aud_head_ok:
                  gk = {"F": "여성", "M": "남성"}.get(str(m.get("primary_gender") or "").upper(), "혼합")
                  out = out.replace("{{metrics.primary_gender_kr}}", gk)
                  out = out.replace("{{metrics.primary_age}}", str(m.get("primary_age") or "-"))
                  out = out.replace("{{metrics.primary_audience_ratio}}", _int_str(m.get("primary_audience_ratio")))
              if m:
                  versus = _metric_versus(m)
                  out = _strip_marked(out, "OPTIONAL_BLOCK", "versus", keep=len(versus) > 0)
                  out = _replace_repeat(
                      out, "metrics_versus", versus,
                      lambda tpl, it, _i: tpl.replace("{{label}}", it["label"]).replace("{{mult}}", it["mult"])
                      .replace("{{org_val}}", it["org_val"]).replace("{{ad_val}}", it["ad_val"])
                      .replace("{{org_w}}", it["org_w"]).replace("{{ad_w}}", it["ad_w"]),
                  )
                  out = _replace_repeat(
                      out, "metrics_spectrum", _metric_spectrum(m),
                      lambda tpl, it, _i: tpl.replace("{{label}}", it["label"]).replace("{{value}}", it["value"])
                      .replace("{{pct}}", it["pct"]).replace("{{band_class}}", it["band_class"]).replace("{{band_label}}", it["band_label"]),
                  )
                  # 콘텐츠 믹스
                  out = out.replace("{{metrics.reel_share_pct}}", _int_str(m.get("reel_share_pct")))
                  out = out.replace("{{metrics.feed_share_pct}}", _int_str(m.get("feed_share_pct")))
                  # 최신 발행일 (ISO → 날짜만)
                  out = out.replace("{{metrics.latest_reel_date}}", (m.get("latest_reel_publish_date") or "-")[:10])
                  out = out.replace("{{metrics.latest_feed_date}}", (m.get("latest_feed_publish_date") or "-")[:10])
                  # 광고 산업
                  has_ad = bool(m.get("has_ad")) and bool(m.get("primary_ad_industry"))
                  out = _strip_marked(out, "OPTIONAL_BLOCK", "ad_industry", keep=has_ad)
                  if has_ad:
                      out = out.replace("{{metrics.primary_ad_industry_ratio}}", _int_str(m.get("primary_ad_industry_ratio")))
                      out = out.replace("{{metrics.primary_ad_industry}}", str(m.get("primary_ad_industry")))
                      others = [x for x in (m.get("ad_industries") or []) if x and x != m.get("primary_ad_industry")]
                      out = _replace_repeat(out, "ad_industries", others,
                                            lambda tpl, it, _i: tpl.replace("{{this}}", str(it)))

              # ---- collaborations ----
              collabs = data.get("collaborations") or []
              out = _strip_marked(out, "OPTIONAL_BLOCK", "collaborations", keep=len(collabs) > 0)
              out = _replace_repeat(
                  out, "collaborations", collabs[:8],
                  lambda tpl, item, _i: tpl.replace("{{brand_logo_url}}", item.get("brand_logo_url") or "")
                  .replace("{{brand_name_kr}}", item["brand_name_kr"]).replace("{{topic}}", item.get("topic") or ""),
              )

              # ---- ppl ranking (집계행 '전체' 제외) ----
              ppl = [x for x in (data.get("ppl_ranking") or []) if (x.get("topic") or "").strip() not in ("전체", "합계", "total", "TOTAL")]
              out = _strip_marked(out, "OPTIONAL_BLOCK", "ppl_ranking", keep=len(ppl) > 0)
              out = _replace_repeat(
                  out, "ppl_ranking", ppl[:3],
                  lambda tpl, item, _i: tpl.replace("{{topic}}", item.get("topic") or "-")
                  .replace("{{total_ppl_count}}", str(item.get("total_ppl_count")))
                  .replace("{{format_compact total_views}}", format_compact(item.get("total_views"))),
              )

              # ---- 성장 모멘텀 등급 (instagram_user_growth_benchmark_criteria) ----
              g = data.get("growth")
              if g:
                  def _spct(v):
                      return f"{'+' if v >= 0 else '−'}{abs(round(float(v) * 100, 1))}%"
                  lo, hi = g["p10"], g["p90"]
                  span = (hi - lo) or 1e-9
                  def _pos(v):
                      return round(max(3.0, min(97.0, (float(v) - lo) / span * 100)), 1)
                  u_pos = _pos(g["growth_rate_3m"]); p20p = _pos(g["p20"]); p50p = _pos(g["p50"]); p80p = _pos(g["p80"])
                  grade = g["grade"]
                  glabel = {"top": "상위권", "mid": "중간권", "bottom": "하위권"}[grade]
                  gclass = {"top": "gtop", "mid": "gmid", "bottom": "gbot"}[grade]
                  verdict = {
                      "top": "같은 팔로워대 또래보다 빠르게 성장 중입니다 — 상승세를 탄 지금이 협업 적기입니다.",
                      "mid": "또래와 비슷한 속도로 안정적으로 성장하고 있어, 리스크가 낮은 구간입니다.",
                      "bottom": "최근 성장 속도는 또래보다 완만하지만, 이미 확보한 팔로워 규모와 콘텐츠 강점이 이를 보완합니다.",
                  }[grade]
                  repl = {
                      "{{growth.rate}}": _spct(g["growth_rate_3m"]),
                      "{{growth.grade_class}}": gclass, "{{growth.grade_label}}": glabel,
                      "{{growth.band}}": f"{format_compact(g['band_min'])}~{format_compact(g['band_max'])}",
                      "{{growth.band_users}}": f"{g['band_user_count']:,}",
                      "{{growth.p20}}": _spct(g["p20"]), "{{growth.p50}}": _spct(g["p50"]), "{{growth.p80}}": _spct(g["p80"]),
                      "{{growth.user_pos}}": str(u_pos), "{{growth.p20_pos}}": str(p20p),
                      "{{growth.p50_pos}}": str(p50p), "{{growth.p80_pos}}": str(p80p),
                      "{{growth.lo_w}}": str(p20p), "{{growth.mid_w}}": str(round(max(0.0, p80p - p20p), 1)),
                      "{{growth.hi_w}}": str(round(max(0.0, 100 - p80p), 1)),
                      "{{growth.verdict}}": verdict,
                  }
                  for k, v in repl.items():
                      out = out.replace(k, v)

              # ---- top posts (썸네일 포함) ----
              def post_row(tpl, post, idx):
                  row = _render_conditionals(tpl, {
                      "is_sponsored_or_ppl": bool(post["is_sponsored_or_ppl"]),
                      "is_reel": bool(post["is_reel"]),
                  })
                  row = row.replace("{{rank}}", str(idx + 1))
                  row = row.replace("{{thumbnail}}", post.get("thumbnail") or "")
                  caption = (post.get("description") or "").replace("\n", " ")[:120]
                  row = row.replace("{{description}}", caption or "(캡션 없음)")
                  row = row.replace("{{format_compact views}}", format_compact(post["views"]))
                  row = row.replace("{{format_compact likes}}", format_compact(post["likes"]))
                  row = row.replace("{{format_compact comments}}", format_compact(post["comments"]))
                  row = row.replace("{{url}}", post.get("url") or "#")
                  return row

              out = _replace_repeat(out, "top_posts", (data.get("top_posts") or [])[:6], post_row)

              # ---- top hashtags ----
              out = _replace_repeat(
                  out, "top_hashtags", (data.get("top_hashtags") or [])[:12],
                  lambda tpl, item, _i: tpl.replace("{{this}}", item.lstrip("#")),
              )

              # ============================================================================
              # 2단 재배치 — 1차: AI 강조 3개 + 각 강조점에 배정된 근거 블록 / 2차: 나머지 근거
              # ============================================================================
              # 근거 블록별 가용성 (데이터가 있는 것만 배치, 없으면 1·2차 어디에도 안 나옴)
              ppl = [x for x in (data.get("ppl_ranking") or []) if (x.get("topic") or "").strip() not in ("전체", "합계", "total", "TOTAL")]
              available = {
                  "identity": idn is not None,
                  "audience": aud is not None,
                  "performance": bool(m),
                  "content_mix": bool(m),
                  "brands": bool(collabs) or bool(ppl) or bool(m and m.get("primary_ad_industry")),
                  "growth": bool(g),
                  "top_posts": bool(data.get("top_posts")),
                  "hashtags": bool(data.get("top_hashtags")),
              }

              def _extract_evidence(eid):
                  mm = re.search(rf"<!-- EVIDENCE: {eid} -->(.*?)<!-- /EVIDENCE -->", out, re.S)
                  return mm.group(1).strip() if mm else ""

              ev_html = {eid: _extract_evidence(eid) for eid in EVIDENCE_IDS if available.get(eid) and _extract_evidence(eid)}

              colors = ["coral", "navy", "mint"]
              used, primary_parts = set(), []
              for i, (title, body, sowhat, ev_ids) in enumerate(highlights):
                  color = colors[i % 3]
                  stroke = "#0f3b30" if color == "mint" else "#fff"
                  card = (
                      f'<div class="panel {color}"><div class="aibadge">✦ AI PICK 0{i + 1}</div>'
                      f'<h2 class="ptitle h">{markers(title)}</h2>'
                      f'<p class="pbody">{clean_insight(body)}</p>'
                  )
                  s = clean_insight(sowhat)
                  if s:
                      card += (f'<div class="win"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{stroke}" '
                               f'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>'
                               f'<div>{s}</div></div>')
                  card += "</div>"
                  blocks = []
                  for eid in ev_ids:
                      if eid in ev_html and eid not in used:
                          used.add(eid)
                          blocks.append(f'<div class="ev-block">{ev_html[eid]}</div>')
                  if blocks:
                      card += ('<div class="panel cream ev-under"><div class="ev-chapter">이 강조점을 뒷받침하는 근거</div>'
                               + "".join(blocks) + "</div>")
                  primary_parts.append(card)

              leftover = [eid for eid in EVIDENCE_IDS if eid in ev_html and eid not in used]
              secondary = ""
              if leftover:
                  secondary = ('<div class="panel cream"><div class="kicker">2차 · 그 외 데이터</div>'
                               '<h2 class="ptitle h" style="font-size:26px">추가로 살펴볼 데이터</h2>'
                               + "".join(f'<div class="ev-block">{ev_html[eid]}</div>' for eid in leftover) + "</div>")

              out = out.replace("<!-- SLOT: primary -->", "\n".join(primary_parts))
              out = out.replace("<!-- SLOT: secondary -->", secondary)
              out = re.sub(r'<div id="evpool".*</body>', "</body>", out, flags=re.S)  # 근거 풀 원본 제거
              return {"html": out}
