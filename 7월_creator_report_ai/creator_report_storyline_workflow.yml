            공감을 삼", "N차 협업 브랜드가 많아 구독자도 신뢰하고 제품을 눈여겨봄". 이렇게 구체적이고 체감되는 특징을 써라.

            - 추상적 형용사("좋은 콘텐츠", "매력적", "퀄리티 높은", "영향력 있는")로 때우지 마라. 관찰 가능한 구체를 써라 —
              근거는 반드시 데이터 안에서: profile.description, top_posts의 실제 캡션 문구·소재, top_hashtags·keywords,
