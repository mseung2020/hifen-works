      data:
        type: llm
        title: AI 강조 포인트 3개
        desc: '인사이트 생성: ai_highlights (자유도 90)'
        model:
          provider: langgenius/anthropic/anthropic
          name: claude-sonnet-4-5-20250929
          mode: chat
          completion_params:
            temperature: 0.85
        prompt_template:
        - role: system
          text: |-
            너는 인스타그램 크리에이터를 광고주에게 소개하는 세일즈 리포트에 들어갈 글을 쓰는 작가다.

