app:
  name: 크리에이터 세일즈 리포트 (스토리라인 + AI 강조 3종)
  description: 인스타그램 크리에이터 아이디를 받아 광고주 소개용 HTML 리포트를 생성한다. 데이터 추출/치환은 결정적 Code 노드가, 프로즈는 3개의 좁은 LLM 노드가 담당. 레이아웃은 설득 논리 스토리라인, AI 강조 3개가 스토리의 챕터.
  mode: workflow
  icon: 📈
  icon_background: '#FFEAD5'
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: '1751000000000'
      type: custom
      position:
        x: 30
        y: 400
      positionAbsolute:
        x: 30
        y: 400
      width: 243
      height: 140
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 시작
        desc: 인스타그램 크리에이터 아이디와 API 키를 입력받는다
        variables:
        - variable: creator_user_id
          label: 크리에이터 인스타그램 아이디
          type: text-input
          required: true
          max_length: 100
          options: []
        - variable: api_key
          label: 리포트 API 키
          type: text-input
          required: true
          max_length: 200
          options: []
        selected: false
    - id: '1751000000001'
      type: custom
      position:
        x: 333
        y: 400
      positionAbsolute:
        x: 333
        y: 400
      width: 243
      height: 140
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: http-request
        title: 크리에이터 리포트 데이터 조회
        desc: data-dify-external-api의 /creators/{user_id}/report 호출
        variables: []
        method: get
        url: https://your-report-api-host.example.com/creators/{{#1751000000000.creator_user_id#}}/report
        headers: X-API-Key:{{#1751000000000.api_key#}}
        params: ''
        body:
          type: none
          data: []
        authorization:
          type: no-auth
          config: null
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        selected: false
    - id: '1751000000010'
      type: custom
      position:
        x: 636
        y: 120
      positionAbsolute:
        x: 636
        y: 120
      width: 260
      height: 150
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: llm
        title: 표지 한 줄
        desc: '인사이트 생성: lead_headline'
        model:
          provider: langgenius/anthropic/anthropic
          name: claude-sonnet-4-5-20250929
          mode: chat
          completion_params:
            temperature: 0.7
        prompt_template:
        - role: system
          text: |-
            너는 인스타그램 크리에이터를 광고주에게 소개하는 세일즈 리포트에 들어갈 글을 쓰는 작가다.

            [숫자·근거]
            - 숫자를 다시 읽어주는 문장("팔로워가 7만명입니다") 금지 — 숫자는 이미 리포트에 표·게이지로 다 나와 있다.
              숫자는 "그래서 그게 무슨 뜻인지"를 말할 때만 최대 1~2개 인용해라.
            - 데이터에 없는 사실을 지어내지 마라(신뢰 훼손). 단, 데이터가 암시하는 것을 해석/추론/상상하는 건 네 역할이다.
            - 과장 광고 카피 톤("무조건 성공!", "완벽한!") 금지. 근거 있는 자신감 있는 톤.

            [톤·문체]
            - 문체는 정중한 '~습니다/~합니다'체로 통일. (단 lead_headline과 ai_highlights의 제목은 명사구 헤드라인 톤 허용)
            - 협찬이 아닌 콘텐츠는 "오가닉" 또는 "비협찬"으로만 부른다. "유기농"/"유기적" 금지.

            [형식 — 매우 중요]
            - 마크다운 문법(#, ##, -, *, **, 백틱, 표, --- 구분선) 절대 금지 — 이 리포트엔 마크다운 렌더러가 없어 기호가 그대로 노출된다.
            - 출력 첫 글자부터 곧바로 본문(또는 지정 형식)이어야 한다. 슬롯 이름/라벨(예: '# audience_persona', 'CLOSING:')을
              앞이나 중간에 절대 붙이지 마라. 문단 사이에 '---' 같은 구분선을 넣지 마라.
            - 지정된 출력 형식(길이·구분자)을 정확히 지켜라. Code 노드가 이 형식을 그대로 파싱한다.
            - 설명·인사말·라벨 반복 없이 본문/지정 형식만 출력해라.

            ## 표지 한 줄 (lead_headline)
            입력: profile.description, identity.user_type_label, identity.topic_label, identity.persona_label, identity.mood_axes(상위3)

            출력 형식: 한 줄. 공백 포함 18~34자. 명사구로 끝내고 마침표 없음.
            추가 지시: 처음 보는 광고주가 3초 안에 "이 사람 뭐 하는 사람이구나"를 잡게 하는 한 줄. 숫자 쓰지 말고 정체성/톤을 압축.
            같은 단어를 한 줄에서 두 번 반복하지 마라. 이 문장은 표지 대문짝만한 헤드라인으로 쓰인다.
            다루지 않을 것: 성과 숫자, 오디언스 통계, 협찬 얘기.
            [강조 마커] 제목에서 가장 핵심인 한 구절을 *별표*로 감쌀 수 있다(예: *단단한 자존감*). 그 구절이 형광펜으로 강조된다. 한 제목에 최대 1개만, 안 써도 된다. 별표는 강조 표시 전용이며 그 외 용도로 * 를 쓰지 마라.
        - role: user
          text: |-
            아래는 이 크리에이터의 전체 데이터(JSON)다. 위 지시에 필요한 필드만 참고해서 써라.

            {{#1751000000001.body#}}
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        variables: []
        selected: false
